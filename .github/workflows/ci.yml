name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with dev extras
        run: pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Run test suite
        run: pytest

      - name: Exercise optional HTTP server
        if: matrix.python-version == '3.12'
        run: |
          pip install -e .[server] httpx numpy
          pytest tests/test_server.py

      - name: Official SDK interoperability
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        env:
          LOCAL_LLM_KIT_OPENAI_INTEROP: '1'
          LOCAL_LLM_KIT_MCP_INTEROP: '1'
        run: |
          pip install openai 'mcp>=2.0,<3'
          pytest tests/test_responses_sdk.py tests/test_mcp_interop.py

      - name: Import smoke test (light core, no heavy deps)
        run: >
          python -c
          "import local_llm_kit;
          from importlib.metadata import version;
          assert local_llm_kit.__version__ == version('local-llm-kit'), local_llm_kit.__version__;
          from local_llm_kit import LLM, chat, complete, add_function;
          print('smoke OK', local_llm_kit.__version__)"

      - name: CLI smoke test
        run: local-llm-kit --help
