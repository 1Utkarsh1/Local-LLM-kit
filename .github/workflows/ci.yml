name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with dev extras
        run: pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Run test suite
        run: pytest

      - name: Import smoke test (light core, no heavy deps)
        run: >
          python -c
          "import local_llm_kit;
          assert local_llm_kit.__version__ == '0.2.0', local_llm_kit.__version__;
          from local_llm_kit import LLM, chat, complete, add_function;
          print('smoke OK', local_llm_kit.__version__)"

      - name: CLI smoke test
        run: local-llm-kit --help
