name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with dev extras
        run: pip install -e .[dev]

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Run test suite
        run: pytest

      - name: Exercise optional HTTP server
        if: matrix.python-version == '3.12'
        run: |
          pip install -e .[server] httpx numpy
          pytest tests/test_server.py

  apple-foundation:
    name: Apple Foundation Models (macOS)
    runs-on: macos-latest
    if: github.repository == '1Utkarsh1/Local-LLM-kit'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package with apple-fm extra
        run: pip install -e ".[apple-fm]"

      - name: Lint (ruff)
        run: ruff check local_llm_kit/backends/apple_foundation.py

      - name: Format check (black)
        run: black --check local_llm_kit/backends/apple_foundation.py

      - name: Run Apple FM tests
        run: pytest tests/test_apple_foundation.py -v

      - name: Import smoke test (light core, no heavy deps)
        run: >
          python -c
          "import local_llm_kit;
          assert local_llm_kit.__version__ == '0.2.0', local_llm_kit.__version__;
          from local_llm_kit import LLM, chat, complete, add_function;
          print('smoke OK', local_llm_kit.__version__)"

      - name: CLI smoke test
        run: local-llm-kit --help
